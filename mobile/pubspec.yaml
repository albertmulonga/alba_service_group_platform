name: alba_mobile
description: ALBA SERVICE GROUP PLATFORM - Application Mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & State
  dio: ^5.4.1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  # Local storage (offline-first)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI
  cupertino_icons: ^1.0.8
  material_color_utilities: ^0.8.0
  google_fonts: ^6.2.1
  lucide_icons: ^1.0.0
  fl_chart: ^0.69.0
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.3.1
  file_picker: ^8.1.0
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
